[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "sakurascope"
version = "0.8.0"
description = "Japan Research & Graduate Opportunity Intelligence — collect, verify, and report public research opportunities in Japan."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
  { name = "SakuraScope Contributors" },
]
keywords = [
  "japan",
  "graduate-school",
  "research",
  "opportunity",
  "open-source",
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Console",
  "Intended Audience :: Education",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Education",
]
dependencies = [
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "PyYAML>=6.0",
  "httpx>=0.27",
  "beautifulsoup4>=4.12",
  "feedparser>=6.0",
  "SQLAlchemy>=2.0",
  "streamlit>=1.36",
  "pymupdf>=1.24,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "ruff>=0.6",
]

[project.scripts]
sakurascope = "sakurascope.cli:main"

[project.urls]
Homepage = "https://github.com/inamashiro/sakurascope"
Documentation = "https://github.com/inamashiro/sakurascope#readme"
Changelog = "https://github.com/inamashiro/sakurascope/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/sakurascope"]

[tool.hatch.build.targets.sdist]
include = [
  "src",
  "tests",
  "config",
  "docs",
  "README.md",
  "LICENSE",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["-ra", "--strict-markers"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "B",
  "UP",
  "SIM",
]
ignore = [
  "E501",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
