# MOCK settings used only by automated tests.
app:
  name: SakuraScopeTest
  environment: test

paths:
  data_dir: data/runtime
  log_dir: logs
  sources_file: config/sources.example.yaml
  research_areas_file: config/research_areas.yaml
  reports_dir: reports
  database_filename: sakurascope_test.db

logging:
  level: WARNING
  format: "%(levelname)s | %(name)s | %(message)s"

http:
  user_agent: "SakuraScope-Test/0.2"
  timeout_seconds: 5
  max_retries: 0
  min_request_interval_seconds: 0.0
  max_response_bytes: 1000000
  respect_robots_txt: false

ai:
  enabled: false
  provider: none
