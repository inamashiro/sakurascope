# Scheduled / manual collect.
#
# IMPORTANT persistence limits:
# - The GitHub Actions filesystem is ephemeral. SQLite written here does NOT
#   survive to the next scheduled run unless you download/upload artifacts.
# - Never commit live SQLite DBs or API keys to the repository.
# - Default example sources are MOCK and disabled → collect may attempt 0 sources.
# - Provide your own sources via a private fork config, or replace the sources
#   file in a prior step. Keep request rates polite.

name: Collect

on:
  schedule:
    # Weekly Monday 03:15 UTC — adjust as needed.
    - cron: "15 3 * * 1"
  workflow_dispatch:
    inputs:
      mode:
        description: "Collect mode"
        required: true
        default: incremental
        type: choice
        options:
          - full
          - incremental
          - retry_failed
      run_retries:
        description: "In-run retries for failed sources"
        required: false
        default: "1"

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[dev]"

      - name: Run tests before collect
        run: python -m pytest -q

      - name: Prepare runtime dirs
        run: |
          mkdir -p data/runtime logs reports

      - name: Collect
        env:
          # Optional: set repository secret SAKURASCOPE_AI_API_KEY only if AI enabled.
          SAKURASCOPE_AI_API_KEY: ${{ secrets.SAKURASCOPE_AI_API_KEY }}
        run: |
          MODE="${{ github.event.inputs.mode || 'incremental' }}"
          RETRIES="${{ github.event.inputs.run_retries || '1' }}"
          echo "Collect mode=$MODE run_retries=$RETRIES"
          if [ "$MODE" = "full" ]; then
            python -m sakurascope collect --run-retries "$RETRIES"
          elif [ "$MODE" = "retry_failed" ]; then
            python -m sakurascope collect --retry-failed --run-retries "$RETRIES"
          else
            python -m sakurascope collect --incremental --run-retries "$RETRIES"
          fi
          python -m sakurascope changes --hours 168 || true
          python -m sakurascope report --format markdown --format json || true

      - name: Upload reports artifact (ephemeral history)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sakurascope-reports-${{ github.run_id }}
          path: |
            reports/
            logs/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload SQLite snapshot (optional; not permanent history)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sakurascope-db-${{ github.run_id }}
          path: data/runtime/*.db
          if-no-files-found: warn
          retention-days: 7
